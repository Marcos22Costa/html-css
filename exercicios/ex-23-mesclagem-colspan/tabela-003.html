<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mesclagem de Tabelas</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
        }
        table {
            width: 300px;
            border-collapse: collapse;   
        }
        td {
            border: 1px solid black;
            padding: 10px;
            text-align: center;
        }
    </style>
</head>
<body>
    <h1> Organizando Tabelas</h1>

    <table>
        <tr>
            <td colspan="3">A</td>
            
            <td colspan="2">D</td>
            
            
        </tr>
        <tr>
            <td colspan="2">F</td>
            
            <td>H</td>
            <td rowspan="3">I</td>
            <td>J</td>
        </tr>
        <tr>
            <td colspan="3">K</td>
            
            
            <td rowspan="2">O</td>
            
        </tr>
        <tr>
            
            <td>P</td>
            <td colspan="2">Q</td>
            
            
            
            
        </tr>
    </table>
    
</body>
</html>
