<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estudos de iframes</title>
    <style>
        iframe {
            width: 500px;
            height: 500px;
            border: 1px solid black;
        }
    </style>
</head>
<body>
    <h1>Testando o uso de um iframe</h1>
    <!--Por padrão um iframe tem 300px de largura por 150px de altura. Caso não exista criaçã da folha de estilo(que tem prioridade) coloca-se a dimensão logo após frameborder= "0" dentro do > Também pode se usar o parâ,etro "scolling" que tem opções auto, yes e no também dentro do > após o frameborder... veja o exemplo. Se usar no style parâmetros para border, pode se excluir o frameboard-->
    <p>Acessando o site do
        <iframe src="https://www.cursoemvideo.com" frameborder="0" height="500" scolling="auto"></iframe>
        <a href="https://www.cursoemvideo.com" target="_blank"></a>
        para aprender a programar</p>
        <p>O repositório do Guanabara 
        <iframe src="https://gustavoguanabara.github.io" frameborder="0"></iframe>
        <a href="https://gustavoguanabara.github.io" target="_blank"></a>
        é bem legal</p>
    
</body>
</html>
